name: deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/**'
      - 'public/**'
      - 'scripts/**'
      - 'storage/templates/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: rafabru-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HOSTGATOR_HOST }}
      SSH_PORT: ${{ secrets.HOSTGATOR_PORT }}
      SSH_USER: ${{ secrets.HOSTGATOR_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_KEY }}
      PUBLIC_PATH: ${{ secrets.HOSTGATOR_PUBLIC_PATH }}
      APP_PATH: ${{ secrets.HOSTGATOR_APP_PATH }}
      DATA_PATH: ${{ secrets.RAFABRU_DATA_PATH }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, mbstring, curl

      - name: Validate application files
        shell: bash
        run: |
          set -euo pipefail
          find app public scripts config -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find public/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php -r '
          foreach (glob("storage/templates/*.json") as $file) {
              json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              echo "valid: {$file}\n";
          }
          '

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY PUBLIC_PATH APP_PATH DATA_PATH)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required repository secret for ${name}." >&2
              exit 1
            fi
          done

      - name: Configure persistent SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/rafabru_deploy"
          chmod 600 "$HOME/.ssh/rafabru_deploy"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host rafabru-host
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile $HOME/.ssh/rafabru_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ConnectionAttempts 5
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ControlMaster auto
            ControlPersist 10m
            ControlPath $HOME/.ssh/cm-%C
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Verify HostGator connection
        shell: bash
        run: |
          set -euo pipefail
          ssh rafabru-host 'printf "Connected to HostGator.\n"'

      - name: Prepare remote directories
        shell: bash
        run: |
          set -euo pipefail
          ssh rafabru-host \
            "mkdir -p '$PUBLIC_PATH' '$APP_PATH/app' '$APP_PATH/config' '$APP_PATH/scripts' '$APP_PATH/storage/templates' '$DATA_PATH/audio'"

      - name: Build private deployment tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy-private
          mkdir -p .deploy-private/storage
          cp -a app config scripts .deploy-private/
          cp -a storage/templates .deploy-private/storage/

      - name: Deploy public files
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "Transfer attempt ${attempt} failed; waiting before retry..." >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          retry rsync -az --delete -e ssh \
            public/ "rafabru-host:$PUBLIC_PATH/"

      - name: Deploy private application code
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "Transfer attempt ${attempt} failed; waiting before retry..." >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          retry rsync -az --delete -e ssh \
            .deploy-private/ "rafabru-host:$APP_PATH/"

      - name: Validate and migrate deployed application
        shell: bash
        run: |
          set -euo pipefail
          ssh rafabru-host \
            "PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php; \
             if [ ! -x \"\$PHP_BIN\" ]; then PHP_BIN=\$(command -v php); fi; \
             \"\$PHP_BIN\" -l '$APP_PATH/app/bootstrap.php'; \
             \"\$PHP_BIN\" -l '$APP_PATH/app/wall.php'; \
             \"\$PHP_BIN\" -l '$PUBLIC_PATH/index.php'; \
             \"\$PHP_BIN\" -l '$PUBLIC_PATH/write/index.php'; \
             if [ -f '$DATA_PATH/config.php' ]; then \
               RAFABRU_CONFIG='$DATA_PATH/config.php' \"\$PHP_BIN\" '$APP_PATH/scripts/migrate-wall.php'; \
               echo 'Private data and wall storage are initialized.'; \
             else \
               echo 'NOTICE: Run the one-time installer before using the admin login.'; \
             fi"

      - name: Check public pages and wall API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            https://rafabru.duckdns.org/ > /dev/null
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            https://rafabru.duckdns.org/write/ > /dev/null
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 \
            https://rafabru.duckdns.org/api/wall/list.php > /dev/null
