name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JSON templates
        run: |
          php -r '
          foreach (glob("storage/templates/*.json") as $file) {
              json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              echo "valid: {$file}\n";
          }
          '
