name: validate

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, mbstring, curl

      - name: Lint PHP files
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find public/assets/js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          php public/write-script.php > /tmp/rafabru-write-wall.generated.js
          node --check /tmp/rafabru-write-wall.generated.js
          grep -Fq "expandedPages" /tmp/rafabru-write-wall.generated.js
          grep -Fq "normalized.includes('⟦RAFABRU_PAGE_BREAK⟧')" /tmp/rafabru-write-wall.generated.js
          grep -Fq "window.rafabruOpenPublishedNote" /tmp/rafabru-write-wall.generated.js
          grep -Fq "Add at least one checklist item before publishing." public/assets/js/draft-checklist-repair.js
          grep -Fq "notebookModal.classList.add('is-published-unified')" public/assets/js/published-note-state.js
          grep -Fq "renderWritingPages" public/assets/js/published-note-state.js
          grep -Fq "renderChecklist" public/assets/js/published-note-state.js
          grep -Fq ".notebook-modal.is-published-unified" public/assets/js/published-note-event-guard.js
          grep -Fq "clearStaleMovementState" public/assets/js/wall-note-click-controller.js
          grep -Fq "movementIsActuallyActive" public/assets/js/wall-note-click-controller.js
          grep -Fq "ensureTrailingRows" public/assets/js/checklist-surface-controller.js
          grep -Fq "resetDiscardedDraft" public/assets/js/checklist-surface-controller.js
          grep -Fq "rafabru_wall_client_schema" public/assets/js/wall-client-migrate.js
          grep -Fq "recoveredMural" public/assets/js/wall-loader-watchdog.js
          grep -Fq "wall/list.php?recovery" public/assets/js/wall-loader-watchdog.js
          ! grep -Fq "published-note-layer" public/assets/js/published-note-state.js

      - name: Validate JSON templates
        run: |
          php -r '
          foreach (glob("storage/templates/*.json") as $file) {
              json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR);
              echo "valid: {$file}\n";
          }
          '

      - name: Smoke test SQLite wall
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rafabru-ci-data
          cat > /tmp/rafabru-ci-config.php <<'PHP'
          <?php
          return [
              'data_dir' => '/tmp/rafabru-ci-data',
              'session_name' => 'rafabru_ci',
              'session_timeout' => 1800,
              'max_upload_bytes' => 26214400,
              'admin_username' => 'serafim',
              'admin_password_hash' => 'REPLACE_WITH_PASSWORD_HASH',
              'turnstile_site_key' => '',
              'turnstile_secret_key' => '',
          ];
          PHP
          export RAFABRU_CONFIG=/tmp/rafabru-ci-config.php
          php scripts/migrate-wall.php
          php -r '
          require "app/bootstrap.php";
          require "app/wall.php";

          $write = rafabru_wall_create_note([
              "body" => "First page\n\nSecond paragraph",
              "author" => "CI Writer",
              "preview" => "Smoke test",
              "title" => "A notebook",
              "color" => "pink-2",
              "x" => 0.5,
              "y" => 300,
              "rotation" => -1.2,
          ]);
          if (($write["type"] ?? "") !== "write" || abs(($write["rotation"] ?? 0) + 1.2) > 0.001) {
              throw new RuntimeException("Write-note creation failed.");
          }

          $check = rafabru_wall_create_note([
              "noteType" => "check",
              "body" => "",
              "author" => "CI Friend",
              "title" => "Packing list",
              "color" => "blue-2",
              "x" => 0.35,
              "y" => 520,
              "rotation" => 1.4,
              "checklist" => [
                  ["text" => "Keys", "checked" => false],
                  ["text" => "Wallet", "checked" => false],
                  ["text" => "", "checked" => false],
                  ["text" => "", "checked" => false],
                  ["text" => "", "checked" => false],
              ],
          ]);
          if (($check["type"] ?? "") !== "check" || count($check["checklist"] ?? []) < 5 || ($check["completed"] ?? true)) {
              throw new RuntimeException("Checklist creation failed.");
          }

          $check = rafabru_wall_set_checklist_item($check["id"], "ci friend", 0, true);
          $check = rafabru_wall_set_checklist_item($check["id"], "CI FRIEND", 1, true);
          if (($check["completed"] ?? false) !== true) {
              throw new RuntimeException("Checklist completion failed.");
          }

          $check = rafabru_wall_update_note($check["id"], "ci friend", [
              "title" => "Updated packing list",
              "checklist" => [
                  ["text" => "Keys", "checked" => true],
                  ["text" => "Wallet", "checked" => false],
                  ["text" => "Charger", "checked" => false],
                  ["text" => "", "checked" => false],
                  ["text" => "", "checked" => false],
              ],
          ]);
          if (($check["title"] ?? "") !== "Updated packing list" || count($check["checklist"] ?? []) < 5 || ($check["completed"] ?? true)) {
              throw new RuntimeException("Checklist owner editing failed.");
          }

          $moved = rafabru_wall_move_note($write["id"], "ci writer", 0.66, 760);
          if (abs(($moved["x"] ?? 0) - 0.66) > 0.001 || ($moved["y"] ?? 0) !== 760) {
              throw new RuntimeException("Owner movement failed.");
          }

          $updated = rafabru_wall_update_note($write["id"], "CI Writer", [
              "title" => "Edited notebook",
              "body" => "Edited body",
          ]);
          if (($updated["title"] ?? "") !== "Edited notebook" || ($updated["body"] ?? "") !== "Edited body") {
              throw new RuntimeException("Owner editing failed.");
          }

          try {
              rafabru_wall_update_note($check["id"], "Someone else", ["title" => "Nope"]);
              throw new RuntimeException("Wrong-name checklist editing was accepted.");
          } catch (DomainException) {
          }

          try {
              rafabru_wall_move_note($write["id"], "Someone else", 0.2, 200);
              throw new RuntimeException("Wrong-name ownership was accepted.");
          } catch (DomainException) {
          }

          if (count(rafabru_wall_list_notes()) !== 2) {
              throw new RuntimeException("Wall list failed.");
          }
          echo "wall feature smoke test passed\n";
          '

      - name: Smoke test admin order and route protection
        shell: bash
        run: |
          set -euo pipefail
          export RAFABRU_CONFIG=/tmp/rafabru-ci-config.php
          cat > /tmp/rafabru-ci-data/links.json <<'JSON'
          [
            {"id":"link_a","text":"A","url":"https://example.com/a","order":1},
            {"id":"link_b","text":"B","url":"https://example.com/b","order":2}
          ]
          JSON
          php -r '
          $_SERVER["REQUEST_METHOD"] = "POST";
          require "app/bootstrap.php";
          rafabru_start_session();
          $_SESSION["is_admin"] = true;
          $_SESSION["csrf"] = "ci-token";
          $_POST = ["action" => "move_link_down", "id" => "link_a", "csrf" => "ci-token"];
          require "app/admin-preflight.php";
          '
          php -r '
          $links = json_decode(file_get_contents("/tmp/rafabru-ci-data/links.json"), true, 512, JSON_THROW_ON_ERROR);
          if (($links[0]["id"] ?? "") !== "link_b" || ($links[1]["id"] ?? "") !== "link_a") {
              throw new RuntimeException("Admin order did not persist.");
          }
          '
          rm -f /tmp/rafabru-preflight-returned
          php -r '
          $_SERVER["REQUEST_METHOD"] = "POST";
          require "app/bootstrap.php";
          rafabru_start_session();
          $_SESSION["is_admin"] = true;
          $_SESSION["csrf"] = "ci-token";
          $_POST = ["action" => "add_redirect", "slug" => "write", "csrf" => "ci-token"];
          require "app/admin-preflight.php";
          file_put_contents("/tmp/rafabru-preflight-returned", "bad");
          '
          test ! -e /tmp/rafabru-preflight-returned
          php -r '
          $_SERVER["REQUEST_METHOD"] = "POST";
          require "app/bootstrap.php";
          rafabru_start_session();
          $_SESSION["is_admin"] = true;
          $_SESSION["csrf"] = "ci-token";
          $_POST = ["action" => "add_redirect", "slug" => "playlist", "csrf" => "ci-token"];
          require "app/admin-preflight.php";
          file_put_contents("/tmp/rafabru-preflight-returned", "ok");
          '
          grep -q ok /tmp/rafabru-preflight-returned

      - name: Smoke test public page injection
        shell: bash
        run: |
          set -euo pipefail
          export RAFABRU_CONFIG=/tmp/rafabru-ci-config.php
          REQUEST_URI=/write/ php public/write/index.php > /tmp/rafabru-write.html
          grep -q '/assets/js/wall-client-migrate.js?v=20260726-2' /tmp/rafabru-write.html
          grep -q '/assets/js/wall-note-click-controller.js?v=20260726-2' /tmp/rafabru-write.html
          grep -q '/assets/js/published-note-state.js?v=20260726-2' /tmp/rafabru-write.html
          grep -q '/assets/js/published-note-event-guard.js?v=20260726-2' /tmp/rafabru-write.html
          grep -q '/assets/js/wall-extras-preload.js?v=20260726-2' /tmp/rafabru-write.html
          grep -q '/assets/js/draft-checklist-repair.js?v=20260726-2' /tmp/rafabru-write.html
          grep -q '/assets/js/wall-core-repair.js?v=20260726-2' /tmp/rafabru-write.html
          grep -q '/assets/js/checklist-surface-controller.js?v=20260726-2' /tmp/rafabru-write.html
          grep -q '/assets/js/wall-loader-watchdog.js?v=20260726-2' /tmp/rafabru-write.html
          grep -q '/assets/css/wall-note-click-controller.css?v=20260726-2' /tmp/rafabru-write.html
          ! grep -q '/assets/js/published-note-preclaim.js' /tmp/rafabru-write.html
          grep -Fq 'FilesMatch "\\.(?:css|js)\\$"' public/.htaccess
          ! grep -q '/assets/js/wall-hold-move.js' /tmp/rafabru-write.html
          ! grep -q '/assets/js/wall-move-click-guard.js' /tmp/rafabru-write.html
          ! grep -q '/assets/js/wall-extras-fixes.js' /tmp/rafabru-write.html
          migration_line=$(grep -n '/assets/js/wall-client-migrate.js' /tmp/rafabru-write.html | cut -d: -f1)
          click_line=$(grep -n '/assets/js/wall-note-click-controller.js' /tmp/rafabru-write.html | cut -d: -f1)
          published_line=$(grep -n '/assets/js/published-note-state.js' /tmp/rafabru-write.html | cut -d: -f1)
          preload_line=$(grep -n '/assets/js/wall-extras-preload.js' /tmp/rafabru-write.html | cut -d: -f1)
          write_line=$(grep -n '/assets/js/write-wall.js' /tmp/rafabru-write.html | cut -d: -f1)
          surface_line=$(grep -n '/assets/js/checklist-surface-controller.js' /tmp/rafabru-write.html | cut -d: -f1)
          watchdog_line=$(grep -n '/assets/js/wall-loader-watchdog.js' /tmp/rafabru-write.html | cut -d: -f1)
          test "$migration_line" -lt "$click_line"
          test "$click_line" -lt "$published_line"
          test "$published_line" -lt "$preload_line"
          test "$preload_line" -lt "$write_line"
          test "$write_line" -lt "$surface_line"
          test "$surface_line" -lt "$watchdog_line"
          REQUEST_URI=/api/site-data.php php public/api/site-data.php > /tmp/rafabru-site-data.json
          php -r '
          $data = json_decode(file_get_contents("/tmp/rafabru-site-data.json"), true, 512, JSON_THROW_ON_ERROR);
          if (count($data["siteLinks"] ?? []) < 4) throw new RuntimeException("Internal site links missing.");
          '
